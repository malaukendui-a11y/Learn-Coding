<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Figure & Figcaption</title>
</head>
<body>
    <figure>
    <img src="image/momen 3.jpeg" alt="">
    <figcaption>Gambar ini adalah contoh dari tag figcaption</figcaption>
    </figure>

    <figure>
        <pre>
            <code>
                function sayHello() {
                    console.log('Hello, World');
                }
            </code>
        </pre>
        <figcaption>Ini adalah contoh JavaScript</figcaption>
    </figure>
</body>
</html>
