<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag optgroup</title>
</head>
<body>
    <select name="menu" id="menu">
        <optgroup label="Minuman">
            <option value="Es Teh">Es Teh</option>
            <option value="Kopi">Kopi</option>
            <option value="Air Putih">Air Putih</option>
        </optgroup>
        <br>
        <optgroup label="Makanan">
            <option value="Nasi Goreng">Nasi Goreng</option>
            <option value="Mie Goreng">Mie Goreng</option>
            <option value="Telur Rebus">Telur Rebus</option>
        </optgroup>
    </select>
</body>
</html>
