<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuat Image Maps</title>
</head>
<body>
    <img src="image/Peta_Indonesia.jpg" alt="Peta_Indonesia" 
    usemap="#map_gambar">
    <map name="map_gambar">
        <area shape="circle" coords="257,170,83" href="https://en.wikipedia.org/wiki/Kalimantan" alt="Kalimantan">
    </map>
    <br>
    <br>
    <img src="image/Peta_Indonesia.jpg" alt="Peta_Indonesia" 
    usemap="#map_gambar">
    <map name="map_gambar">
        <area shape="poly" coords="257,187,533" href="https://en.wikipedia.org/wiki/Jawa" alt="Jawa">
    </map>
</body>
</html>
