<!DOCTYPE html>

    <title>Operator Aritmatika</title>
</head>
<body>

    <script>
        // Perhitungan Aritmatika +, -, /, %
        let nilai1 = 8;
        let nilai2 = 4;

        let hasil = nilai1 % nilai2;
        // console.log(hasil);
        document.write(hasil);
    </script>
