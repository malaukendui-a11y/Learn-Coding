<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perulangan While</title>
</head>
<body>
    
    <script>
        let username = prompt("Masukan Username");

        while (username !== "admin") {
            alert("Username salah, coba lagi");
            username = prompt("Masukan Username");
        }

        alert("Usename Benar");
    </script>
</body>
</html>
