<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perulangan For</title>
</head>
<body>
    
    <script>
        // Perulangan For
        // for (let i = 1; i <= 10; i++) {
        //     document.write(`<p> Perulangan ${i} </p>`);
        // }

        let jumlah = 0;

        for (let i = 1; i <= 100; i++) {
            jumlah += i;
        }
        document.write(`Jumlah Angka dari 1 sampai 100 adalah: ${jumlah}`);
    </script>
</body>
</html>
