<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Input</title>
    <style>
        div {
            width: 80%;
            margin: 30px auto;
        }

        input {
            pad: 20px;
            width: 200px;
        }

        p {
            font-size: 24px;
        }
    </style>
</head>

<body>
    <div>
        <input type="text" id="input-text" placeholder="Ketik Sesuatu...">
        <p id="output-text"></p>
    </div>
    <script>
        function cekSaldo(saldo){
            if (Number.isNaN(saldo)){
                console.log("Bukan Angka");
                return;
            } else if (saldo === 0){
                console.log("Harga nol");
                return;
            } else if (saldo < 0){
                console.log("Harga Minus");
                return;
            } else {
                console.log("harga valid");
            }
        }

        cekSaldo(50000)
    </script>
</body>

</html>
