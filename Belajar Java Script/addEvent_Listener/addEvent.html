    <button id="tombolUbahTeks">Klik Saya</button>
    <p id="teks">Teks Awal</p>

    <script>
        // ambil elemen
        let tombolUbahTeks = document.getElementById("tombolUbahTeks");
        let paragraf = document.getElementById("teks");

        // function
        function ubahTeks() {
            paragraf.innerHTML = "Teks telah berubah";
        }
        // event listener
        tombolUbahTeks.addEventListener("click", ubahTeks);
    </script>

</body>
