<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array For Loop</title>
</head>
<body>
    
    <script>
        let buah = ["Rangga", "Asoy", "Banget"];
        buah.push("Suka Key");
        for (let i = 0; i < buah.length; i++) {
            console.log(buah [i]);
        }
        // console.log(buah [0]);
        // console.log(buah [1]);
        // console.log(buah [2]);


    </script>
</body>
</html>
