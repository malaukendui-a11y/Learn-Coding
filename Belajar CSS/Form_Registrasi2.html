    <title>Form Registrasi 2</title>
    <link rel="stylesheet" href="CSS/Form_Registrasi 2.css">
</head>
<body>
    <form action="">
        <h3>Form Registrasi</h3>
        <label for="nama">Nama Anda</label>

        <button type="submit">Submit</button>
    </form>
