<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Statement</title>
</head>
<body>
    
    <script>
        const nilai = "B";

        switch (niali) {
            case "A":
                document.writeln("<p>Wow Anda Lulus dengan baik</p>");
                break;
            case "B":
                document.writeln("<p>Anda Lulus dengan lumayan</p>");
                break;
            case "C":
                document.writeln("<p>Anda Lulus</p>");
                break;
            case "D":
                document.writeln("<p>Anda Tidak lulus</p>");
                break;
            default:
                document.writeln("<p>Sebaiknya anda ganti jurusan</p>");
        }
    </script>
</body>
</html>
