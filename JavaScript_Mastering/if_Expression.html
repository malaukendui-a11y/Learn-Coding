<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if Expression</title>
</head>
<body>
    
    <script>
        const examValue = 90;

        if (examValue > 80) {
            document.writeln("<p>Good Job</p>");
        } else if (examValue > 60) {
            document.writeln("<p>Not Bad</p>");
        } else {
            document.writeln("<p>Try Again</p>");
        };
    </script>
</body>
</html>
