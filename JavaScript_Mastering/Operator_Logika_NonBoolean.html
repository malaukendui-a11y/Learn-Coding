<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Logika Non Boolean</title>
</head>
<body>
    
    <script>
        // Operator || Mengambil Nilai Pertama Yang Thurty
        console.info("hello" || "");
        console.info("" || []);
        console.info("0" || "NOL");
        console.info(0 || "NOL");
        console.info(null || "NULL");
        console.info(undefined || "UNDEFINED");
        console.info(0 || false);

        const person = {
            firstName: "",
            lastName: "Kenny"
        };

        const name = person.firstName || person.lastName;
        console.info(name);

        // Operator && Mengambil Nilai Pertama Yang Falsy
        console.info("Hello" && '');
        console.info("" && []);
        console.info("" && "NOL");

    </script>
</body>
</html>
