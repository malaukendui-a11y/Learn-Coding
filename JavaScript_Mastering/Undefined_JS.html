<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undifined</title>
</head>
<body>
    
    <script>
        let name;

        if (name === undefined) {
            alert("UNDIFINED");
        } else {
            alert("DEFINED");
        };

        // Undefined Array Value
        const names = ["Ananda", "Kenny"];

        if (names[2] === undefined) {
            console.info("Array Undefined");
        } else {
            console.info("Array Defined");
        };

        // Undefined Object Property
        const person = {};

        if (person.name === undefined) {
            console.info("Object Undefined");
        } else {
            console.info("Object Defined");
        };
    </script>
</body>
</html>
